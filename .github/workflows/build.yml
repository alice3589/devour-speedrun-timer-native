# 公開ソースから winhttp.dll をビルドする。
# v で始まるタグを push すると、ビルド来歴の証明を付けて「下書き」リリースを作る
# (自動では公開しない。内容を確認してから手動で公開する)。
name: build

on:
  push:
    branches: [main, "release/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Compute SHA-256
        shell: bash
        run: |
          cd dist/drop-in
          sha256sum winhttp.dll | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: winhttp
          path: |
            dist/drop-in/winhttp.dll
            dist/drop-in/SHA256SUMS.txt
          if-no-files-found: error

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: winhttp
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: winhttp.dll
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          HASH=$(cut -d' ' -f1 SHA256SUMS.txt)
          {
            echo "SHA-256 (\`winhttp.dll\`): \`$HASH\`"
            echo
            echo "Built by GitHub Actions from this tag. Verify with:"
            echo
            echo "\`\`\`"
            echo "gh attestation verify winhttp.dll -R $GITHUB_REPOSITORY"
            echo "\`\`\`"
          } > notes.md
          gh release create "$TAG" winhttp.dll SHA256SUMS.txt \
            -R "$GITHUB_REPOSITORY" --draft --title "$TAG" --notes-file notes.md
